<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutores - Clínica Veterinária</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="cabecalho"></header>
  <main>
    <div id="msg" class="msg"></div>
    <section class="cartao">
      <h2 id="titulo">Novo tutor</h2>
      <form id="form">
        <input type="hidden" id="id">
        <label>Nome <input id="nome" required></label>
        <label>CPF (somente números) <input id="cpf" maxlength="14" required></label>
        <label>Telefone <input id="telefone" required></label>
        <label>E-mail <input type="email" id="email"></label>
        <label>Endereço <input id="endereco"></label>
        <div class="acoes">
          <button type="submit">Salvar</button>
          <button type="button" class="cinza" onclick="limpar()">Cancelar</button>
        </div>
      </form>
    </section>
    <section class="cartao">
      <h2>Tutores cadastrados</h2>
      <table>
        <thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>E-mail</th><th>Ações</th></tr></thead>
        <tbody id="lista"></tbody>
      </table>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/tutores.js"></script>
</body>
</html>
