<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Clínica Veterinária</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login cartao">
    <h2>Clínica Veterinária</h2>
    <p>Entre para acessar o sistema.</p>
    <div id="msg" class="msg"></div>
    <form id="form">
      <label>E-mail <input type="email" id="email" required></label>
      <label>Senha <input type="password" id="senha" required></label>
      <button type="submit">Entrar</button>
    </form>
  </div>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.value, senha: senha.value }),
        });
        const dados = await resp.json();
        if (!resp.ok) throw new Error(dados.erro);
        localStorage.setItem('token', dados.token);
        localStorage.setItem('nome', dados.nome);
        location.href = 'index.html';
      } catch (err) {
        msg.className = 'msg erro';
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
